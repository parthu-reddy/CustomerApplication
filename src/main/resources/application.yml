spring:
  application:
    name: customer-service
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  cloud:
    config:
      fail-fast: true
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids: true
resilience4j:
  circuitbreaker:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
      bidding-engine:
        baseConfig: default
  retry:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
  timelimiter:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
      bidding-engine:
        timeoutDuration: 100ms
idempotency:
  retention-days: 400
