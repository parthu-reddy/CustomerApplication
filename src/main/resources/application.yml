# The two delivery radii, bound by DeliveryZoneConfig. They default to the same value and are
# separate because they answer separate questions: how far the customer may be from the restaurant,
# and how far a rider may be from the restaurant.
delivery:
  zone:
    max-radius-km: 5.0
    fleet-search-radius-km: 5.0
    default-city: BLR

spring:
  application:
    name: customer-service
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  cloud:
    config:
      fail-fast: true
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids: true
resilience4j:
  circuitbreaker:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
      bidding-engine:
        baseConfig: default
  retry:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
  timelimiter:
    instances:
      restaurant-service:
        baseConfig: default
      mapsintegration:
        baseConfig: default
      payment-service:
        baseConfig: default
      bidding-engine:
        timeoutDuration: 100ms
idempotency:
  retention-days: 400
